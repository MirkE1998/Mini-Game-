<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <!-- Optionaler Starter für ein eigenes Homescreen-Icon.
       Apps Script erlaubt keinen apple-touch-icon-Link auf der äußeren Seite. Diese kleine Seite
       (z. B. über GitHub Pages gehostet) liefert Icon + Manifest und bettet die Web-App ein.
       WEBAPP_URL unten durch die /exec-URL der Apps-Script-Bereitstellung ersetzen. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Hautritual">
  <meta name="theme-color" content="#F7F1E8">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" type="image/png" href="icon-180.png">
  <link rel="manifest" href="manifest.json">
  <title>Hautritual</title>
  <style>
    html, body { margin: 0; height: 100%; background: #F7F1E8; }
    iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body>
  <iframe src="WEBAPP_URL" title="Hautritual" allow="autoplay"></iframe>
</body>
</html>

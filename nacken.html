<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Nacken Training</title>
<style>
  :root{color-scheme:dark}
  html,body{margin:0;height:100%;background:#1b1b24;color:#fff;font-family:system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center}
  canvas{width:min(100vw,calc(100vh*1.2));height:auto;aspect-ratio:480/400;background:#000;border-radius:8px}
  p{margin:8px 12px;font-size:14px;opacity:.8;text-align:center}
</style>
</head>
<body>
<canvas id="c" width="480" height="400"></canvas>
<p>Klicken / tippen / LEERTASTE = Nacken ziehen. Füll den Balken, bis es passiert!</p>
<script>
const cv = document.getElementById('c'), g = cv.getContext('2d');
const SKIN = '#e0a98a', SKIN_D = '#c98c6c', SKIN_L = '#eebb9d';
let state = 'start';          // start | play | boom | won
let progress = 0, clicks = 0, best = 0;
let pulse = 0;                // Ruck beim Klick
let boomT = 0, t = 0;
let sweat = [];
const CLICKS_NEEDED = 28;

function reset() { progress = 0; clicks = 0; pulse = 0; boomT = 0; sweat = []; state = 'play'; }
function pull() {
  if (state === 'start' || state === 'won') { if (state === 'won' || state === 'start') return reset(); }
  if (state !== 'play') return;
  clicks++; pulse = 1;
  progress = Math.min(1, clicks / CLICKS_NEEDED);
  sweat.push({ x: 215 + Math.random() * 50, y: 150, vy: 0, vx: (Math.random() - .5) * 60, life: 1 });
  if (clicks >= CLICKS_NEEDED) { state = 'boom'; boomT = 0; }
}
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); if (!e.repeat) pull(); } });
addEventListener('pointerdown', pull);

const ease = x => { const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };

function update(dt) {
  t += dt;
  pulse = Math.max(0, pulse - dt * 5);
  for (const s of sweat) { s.vy += 400 * dt; s.y += s.vy * dt; s.x += s.vx * dt; s.life -= dt * 1.2; }
  sweat = sweat.filter(s => s.life > 0);
  if (state === 'boom') {
    boomT += dt;
    if (boomT > 1.2) { state = 'won'; best = best ? Math.min(best, clicks) : clicks; }
  }
}

function neckWidth() {
  if (state === 'boom' || state === 'won') {
    const k = state === 'won' ? 1 : Math.min(1, boomT / 0.55);
    return 22 + 190 * ease(k);
  }
  return 16 + progress * 6;   // bleibt auffällig dünn
}

/* ---------- Zeichnen ---------- */
function rect(x, y, w, h, c) { g.fillStyle = c; g.fillRect(x, y, w, h); }
function circ(x, y, r, c) { g.fillStyle = c; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); }
function ell(x, y, rx, ry, c, rot) { g.fillStyle = c; g.beginPath(); g.ellipse(x, y, rx, ry, rot || 0, 0, 7); g.fill(); }
function rr(x, y, w, h, r, c) { g.fillStyle = c; g.beginPath(); g.roundRect(x, y, w, h, r); g.fill(); }

function drawGym() {
  rect(0, 0, 480, 400, '#d9d4c7');
  rect(0, 0, 480, 34, '#cbc5b5');
  rect(0, 340, 480, 60, '#3a3a45'); rect(0, 340, 480, 4, '#2b2b33');   // Gummiboden
  rect(0, 334, 480, 6, '#b9b2a0');
  // Poster
  rr(24, 70, 64, 90, 3, '#2b3a55'); rect(30, 76, 52, 78, '#e8512b');
  g.fillStyle = '#fff'; g.font = 'bold 14px system-ui'; g.textAlign = 'center';
  g.fillText('NO PAIN', 56, 106); g.fillText('NO GAIN', 56, 124);
  // Hantelständer rechts
  rect(390, 250, 8, 90, '#2b2b33'); rect(450, 250, 8, 90, '#2b2b33'); rect(390, 250, 68, 6, '#2b2b33');
  rect(390, 290, 68, 5, '#2b2b33');
  for (const [x, y] of [[400, 238], [420, 238], [440, 238], [408, 278], [432, 278]]) { circ(x, y + 8, 9, '#444'); circ(x, y + 8, 3, '#999'); }
  // Spiegel
  rr(300, 60, 70, 150, 4, '#a9c4d6'); rect(306, 66, 58, 138, '#cfe3ef');
  g.strokeStyle = 'rgba(255,255,255,.7)'; g.lineWidth = 4;
  g.beginPath(); g.moveTo(318, 190); g.lineTo(350, 80); g.stroke();
}

function drawCurlyHair(cx, cy, front) {
  const pts = [];
  for (let a = Math.PI * 1.02; a <= Math.PI * 1.98; a += 0.2) pts.push([cx + Math.cos(a) * 38, cy + Math.sin(a) * 40, 13]);
  pts.push([cx - 40, cy - 6, 12], [cx + 40, cy - 6, 12], [cx - 36, cy + 8, 9], [cx + 36, cy + 8, 9]);
  if (!front) for (const [x, y, r] of pts) circ(x, y, r, '#0c0c0f');
  else {
    // lockiger Pony
    for (const [x, y, r] of [[cx - 22, cy - 30, 10], [cx - 8, cy - 36, 11], [cx + 8, cy - 36, 11], [cx + 22, cy - 30, 10], [cx - 32, cy - 20, 8], [cx + 32, cy - 20, 8]]) circ(x, y, r, '#0c0c0f');
    g.strokeStyle = '#34343c'; g.lineWidth = 2;
    for (const [x, y] of [[cx - 12, cy - 38], [cx + 10, cy - 40], [cx - 28, cy - 28], [cx + 26, cy - 30]]) { g.beginPath(); g.arc(x, y, 5, 0.5, 4.2); g.stroke(); }
  }
}

function drawMan() {
  const nw = neckWidth();
  const boom = state === 'boom' || state === 'won';
  const shake = boom && state === 'boom' ? Math.sin(t * 90) * (1 - Math.min(1, boomT / 0.9)) * 4 : 0;
  const bob = pulse * 6;
  g.save(); g.translate(240 + shake, 0);

  // Torso (Tanktop)
  const sw = boom ? 90 + (nw - 22) * 0.55 : 62;          // halbe Schulterbreite
  g.fillStyle = '#e8512b'; g.beginPath();
  g.moveTo(-sw, 262); g.bezierCurveTo(-sw, 252, -30, 250, 0, 250);
  g.bezierCurveTo(30, 250, sw, 252, sw, 262);
  g.lineTo(sw - 12, 345); g.lineTo(-sw + 12, 345); g.closePath(); g.fill();
  g.fillStyle = 'rgba(0,0,0,.15)'; g.fillRect(-4, 262, 8, 83);
  // Arme
  const armW = boom ? 18 : 13;
  rr(-sw - armW + 4, 258, armW, 78, armW / 2, SKIN); rr(sw - 4, 258, armW, 78, armW / 2, SKIN);
  // Nacken
  const top = 205 + bob * 0.3, bot = 262;
  const f = Math.max(0, Math.min(1, (nw - 24) / 150));     // 0 = dünn, 1 = riesig
  const tw = nw * (1 - 0.5 * f) / 2;                       // oben schmaler, unten breiter
  const ex = nw / 2 + 5 + f * (sw - 15 - nw / 2);
  g.fillStyle = SKIN_D; g.beginPath();
  g.moveTo(-tw, top); g.lineTo(tw, top);
  g.bezierCurveTo(tw + f * 50, 232, nw / 2 + 2 + f * 60, 252, ex, bot + 4);
  g.lineTo(-ex, bot + 4);
  g.bezierCurveTo(-nw / 2 - 2 - f * 60, 252, -tw - f * 50, 232, -tw, top); g.fill();
  // Nacken-Highlights
  g.fillStyle = SKIN; g.beginPath(); g.ellipse(0, 232, nw * 0.28, 22, 0, 0, 7); g.fill();
  if (boom) {                                             // Muskelstränge
    g.strokeStyle = SKIN_D; g.lineWidth = 3;
    for (const k of [-0.34, 0.34]) { g.beginPath(); g.moveTo(nw * k, 214); g.quadraticCurveTo(nw * k * 1.5, 236, nw * k * 2.1, 258); g.stroke(); }
    g.strokeStyle = 'rgba(255,255,255,.25)'; g.lineWidth = 4;
    g.beginPath(); g.moveTo(-nw * 0.18, 218); g.quadraticCurveTo(-nw * 0.24, 236, -nw * 0.36, 252); g.stroke();
  }
  // Haare hinten
  drawCurlyHair(0, 170 + bob, false);
  // Kopf
  ell(0, 170 + bob, 33, 38, SKIN);
  ell(-34, 174 + bob, 5, 8, SKIN_D); ell(34, 174 + bob, 5, 8, SKIN_D);
  drawCurlyHair(0, 170 + bob, true);
  const strain = Math.max(progress, boom ? 1 : 0);
  // Augen
  const hy = 172 + bob;
  for (const ex of [-13, 13]) { ell(ex, hy, 6, boom ? 6 : 5 - strain * 1.5, '#fff'); circ(ex, hy + 1, 2.6, '#2a1a10'); }
  g.strokeStyle = '#0c0c0f'; g.lineWidth = 3; g.lineCap = 'round';
  g.beginPath(); g.moveTo(-21, hy - 11 - strain * 2); g.lineTo(-7, hy - 7 + strain * 2); g.moveTo(21, hy - 11 - strain * 2); g.lineTo(7, hy - 7 + strain * 2); g.stroke();
  // Nase
  g.strokeStyle = SKIN_D; g.lineWidth = 2; g.beginPath(); g.moveTo(0, hy + 2); g.lineTo(-3, hy + 14); g.lineTo(3, hy + 14); g.stroke();
  // Mund: zusammengebissene Zähne
  if (boom) { rr(-13, hy + 20, 26, 11, 4, '#fff'); g.strokeStyle = '#9b2c2c'; g.lineWidth = 2; g.strokeRect(-13, hy + 20, 26, 11); g.beginPath(); g.moveTo(0, hy + 20); g.lineTo(0, hy + 31); g.stroke(); }
  else if (strain > 0.15) { rr(-10, hy + 21, 20, 7 + strain * 4, 3, '#7a1f1f'); rect(-8, hy + 21, 16, 3, '#fff'); }
  else { g.strokeStyle = '#9b2c2c'; g.lineWidth = 2; g.beginPath(); g.moveTo(-8, hy + 24); g.lineTo(8, hy + 24); g.stroke(); }
  // Schweißtropfen
  for (const s of sweat) { g.globalAlpha = Math.max(0, s.life); circ(s.x - 240, s.y, 3, '#8fd3ff'); }
  g.globalAlpha = 1;
  // Kopfgurt + Kette + Gewichtsscheibe
  const lift = pulse * 14;
  g.strokeStyle = '#2b2b33'; g.lineWidth = 7;
  g.beginPath(); g.moveTo(-32, hy + 16); g.quadraticCurveTo(0, hy + 40, 32, hy + 16); g.stroke();
  g.strokeStyle = '#777'; g.lineWidth = 3; g.setLineDash([6, 4]);
  g.beginPath(); g.moveTo(0, hy + 34); g.lineTo(0, 336 - lift); g.stroke(); g.setLineDash([]);
  circ(0, 352 - lift, 20, '#2b2b33'); circ(0, 352 - lift, 15, '#444'); circ(0, 352 - lift, 5, '#999');
  g.fillStyle = '#ddd'; g.font = 'bold 9px system-ui'; g.textAlign = 'center'; g.fillText('20 KG', 0, 366 - lift);
  g.restore();
}

function draw() {
  drawGym();
  drawMan();

  if (state === 'boom') {                                 // Blitz
    const k = boomT < 0.12 ? 1 - boomT / 0.12 : 0;
    if (k > 0) { g.fillStyle = 'rgba(255,255,255,' + (k * 0.85) + ')'; g.fillRect(0, 0, 480, 400); }
  }

  // HUD
  g.fillStyle = '#222'; g.textAlign = 'left'; g.font = 'bold 18px system-ui';
  g.fillText('Züge: ' + clicks, 12, 26);
  g.textAlign = 'right'; g.fillText('Rekord: ' + (best ? best + ' Züge' : '-'), 468, 26);
  // Balken
  rr(110, 372, 260, 18, 9, '#222');
  rr(112, 374, 256 * progress, 14, 7, progress > 0.85 ? '#ff4d2e' : '#f5b72b');
  g.fillStyle = '#fff'; g.font = 'bold 11px system-ui'; g.textAlign = 'center';
  g.fillText('NACKEN-TRAINING ' + Math.round(progress * 100) + '%', 240, 385);

  if (state === 'start' || state === 'won') {
    g.fillStyle = 'rgba(0,0,0,.6)'; g.fillRect(0, 0, 480, 400);
    g.fillStyle = '#fff'; g.textAlign = 'center';
    if (state === 'start') {
      g.font = 'bold 30px system-ui'; g.fillText('Nacken Training', 240, 150);
      g.font = '17px system-ui';
      g.fillText('Klick / tipp so schnell du kannst: jeder Zug', 240, 195);
      g.fillText('füllt den Balken. Der Nacken ist noch dünn...', 240, 220);
      g.fillText('aber irgendwann passiert etwas.', 240, 245);
      g.font = 'bold 20px system-ui'; g.fillText('Tippen zum Starten', 240, 300);
    } else {
      g.font = 'bold 36px system-ui'; g.fillStyle = '#ffd34d'; g.fillText('GEWONNEN!', 240, 100);
      g.fillStyle = '#fff'; g.font = '20px system-ui';
      g.fillText('Nacken wie ein Stier! Nur ' + clicks + ' Züge.', 240, 130);
      g.font = 'bold 20px system-ui'; g.fillText('Tippen für noch eine Runde', 240, 160);
    }
  }
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
